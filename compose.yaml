services:
  nginx:
    container_name: nginx
    build:
      context: ./nginx
    ports:
      - 80:80
    depends_on:
      - client
      - write
    develop:
      watch:
        - action: sync+exec
          path: ./nginx/nginx.conf
          target: /etc/nginx/conf.d/default.conf
          exec:
            command: nginx -s reload
        - path: ./nginx/Dockerfile
          action: rebuild

  client:
    container_name: client
    build:
      context: ./client
    develop:
      watch:
        - action: sync
          path: ./client/src
          target: /app/src
        - action: rebuild
          path: ./client/Dockerfile
        - action: rebuild
          path: ./client/package.json

  write:
    container_name: write
    build:
      context: ./write
    develop:
      watch:
        - path: ./write
          action: sync
          target: /app
        - path: ./write/package.json
          action: rebuild
        - path: ./write/Dockerfile
          action: rebuild
    environment:
      BUCKET_NAME: uploads
    depends_on:
      - redis
      - minio

  redis:
    container_name: redis
    image: redis/redis-stack:latest
    ports:
      - "8001:8001" # RedisInsight UI
      - "6379:6379" # Mapped outside just for RedisInsight access
    volumes:
      - redis_data:/data

  minio:
    container_name: s3
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001" # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  minio_data:
  redis_data:
